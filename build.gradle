plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'maven-publish'
}

version = mod_version
// JitPack подставляет GROUP (com.github.ElgerElg) и VERSION (тег) — публикуемся под ними.
group = System.getenv('GROUP') ?: 'net.elgerelg.cozyvoicechat'
def publishVersion = System.getenv('JITPACK') ? (System.getenv('VERSION') ?: project.version) : project.version
base {
    archivesName = 'cozyvoicechat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// jarJar: вшиваем Opus-кодек Concentus в итоговый jar (META-INF/jarjar/concentus-*.jar)
jarJar.enable()

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                cozyvoicechat {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // Opus-кодек (чистая Java). implementation — для компиляции и dev-рана,
    // jarJar — чтобы библиотека была внутри собранного мода на проде.
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    // В dev-ране Forge не видит обычные библиотеки на classpath модуля — добавляем явно.
    minecraftLibrary 'io.github.jaredmdobson:concentus:1.0.2'
    jarJar(group: 'io.github.jaredmdobson', name: 'concentus', version: '[1.0.2,1.1)') {
        jarJar.pin(it, '1.0.2')
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest.attributes([
        'Specification-Title'     : 'cozyvoicechat',
        'Specification-Vendor'    : 'ElgerElg',
        'Specification-Version'   : '1',
        'Implementation-Title'    : 'Cozy Voice Chat',
        'Implementation-Version'  : project.version,
        'Implementation-Vendor'   : 'ElgerElg'
    ])
    // Обычный jar без вшитого кодека получает суффикс, основным считается jarJar-вариант.
    archiveClassifier = 'slim'
    from('LICENSE')
}

tasks.jarJar.configure {
    archiveClassifier = ''
    from('LICENSE')
}

tasks.build.dependsOn tasks.jarJar
// reobf переписывает jarJar на месте — он обязан идти сразу после него и до публикации.
tasks.jarJar.finalizedBy('reobfJarJar')

// -------------------- публичный API для аддонов --------------------
// Отдельный jar только с пакетом net.elgerelg.cozyvoicechat.api. Классы API не
// обращаются к методам/полям Minecraft (типы MC — только в сигнатурах), поэтому
// jar не зависит от маппингов и публикуется без reobf.

def apiPackage = 'net/elgerelg/cozyvoicechat/api/**'

tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Assembles the Cozy Voice Chat API jar for addon developers.'
    archiveBaseName = 'cozyvoicechat-api'
    archiveClassifier = ''
    from(sourceSets.main.output) {
        include apiPackage
    }
    from('LICENSE')
    manifest.attributes([
        'Specification-Title'     : 'cozyvoicechat-api',
        'Specification-Vendor'    : 'ElgerElg',
        'Specification-Version'   : '1',
        'Implementation-Title'    : 'Cozy Voice Chat API',
        'Implementation-Version'  : project.version,
        'Implementation-Vendor'   : 'ElgerElg'
    ])
}

tasks.register('apiSourcesJar', Jar) {
    group = 'build'
    description = 'Assembles the sources jar of the Cozy Voice Chat API.'
    archiveBaseName = 'cozyvoicechat-api'
    archiveClassifier = 'sources'
    from(sourceSets.main.allJava) {
        include apiPackage
    }
    from('LICENSE')
}

tasks.register('apiJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Generates the Cozy Voice Chat API Javadoc site (API packages only, no internals).'
    source = sourceSets.main.allJava.matching { include apiPackage }
    // Типы Forge/Minecraft разрешаются через classpath, ссылок на их javadoc нет — это не ошибка.
    classpath = sourceSets.main.compileClasspath
    destinationDir = layout.buildDirectory.dir('docs/api-javadoc').get().asFile
    title = "Cozy Voice Chat API ${project.version}"
    failOnError = false
    options {
        encoding = 'UTF-8'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'
        windowTitle = "Cozy Voice Chat API ${project.version}"
        docTitle = "Cozy Voice Chat API ${project.version}"
        bottom = 'Cozy Voice Chat &copy; 2026 ElgerElg &middot; MIT License &middot; ' +
                '<a href="https://github.com/ElgerElg/CozyVoiceChat">GitHub</a>'
        overview = file('src/main/javadoc/overview.html')
        links 'https://docs.oracle.com/en/java/javase/17/docs/api/'
        author = false
        noTimestamp = true
        group('Entry point', ['net.elgerelg.cozyvoicechat.api'])
        group('Server', ['net.elgerelg.cozyvoicechat.api.server', 'net.elgerelg.cozyvoicechat.api.event'])
        group('Client', ['net.elgerelg.cozyvoicechat.api.client', 'net.elgerelg.cozyvoicechat.api.event.client'])
        group('Audio', ['net.elgerelg.cozyvoicechat.api.audio'])
        group('Addons', ['net.elgerelg.cozyvoicechat.api.addon'])
        // doclint: всё, кроме отсутствующих ссылок на внешние (Forge/MC) javadoc. -PjavadocLint=all — полный аудит.
        addStringOption("Xdoclint:${project.findProperty('javadocLint') ?: 'all,-missing'}", '-quiet')
        addStringOption('Xmaxwarns', '10000')
    }
}

tasks.register('apiJavadocJar', Jar) {
    group = 'build'
    description = 'Assembles the Javadoc jar of the Cozy Voice Chat API.'
    archiveBaseName = 'cozyvoicechat-api'
    archiveClassifier = 'javadoc'
    dependsOn tasks.apiJavadoc
    from(tasks.apiJavadoc.destinationDir)
    from('LICENSE')
}

tasks.register('modSourcesJar', Jar) {
    group = 'build'
    description = 'Assembles the sources jar of the whole mod.'
    archiveClassifier = 'sources'
    from(sourceSets.main.allSource)
    from('LICENSE')
}

tasks.assemble.dependsOn tasks.apiJar, tasks.apiSourcesJar, tasks.modSourcesJar

def configurePom = { pom, String pomName, String pomDescription ->
    pom.name = pomName
    pom.description = pomDescription
    pom.url = 'https://github.com/ElgerElg/CozyVoiceChat'
    pom.licenses {
        license {
            name = 'MIT'
            url = 'https://opensource.org/licenses/MIT'
            distribution = 'repo'
        }
    }
    pom.developers {
        developer {
            id = 'ElgerElg'
            name = 'ElgerElg'
        }
    }
    pom.scm {
        url = 'https://github.com/ElgerElg/CozyVoiceChat'
        connection = 'scm:git:https://github.com/ElgerElg/CozyVoiceChat.git'
    }
}

publishing {
    publications {
        // Только API: compileOnly-зависимость аддонов.
        api(MavenPublication) {
            groupId = project.group
            artifactId = 'cozyvoicechat-api'
            version = publishVersion
            artifact tasks.apiJar
            artifact tasks.apiSourcesJar
            artifact tasks.apiJavadocJar
            configurePom(pom, 'Cozy Voice Chat API', 'Public API for Cozy Voice Chat addons (Forge 1.20.1).')
        }
        // Мод целиком (jarJar-вариант с Concentus) — для запуска в dev-окружении аддона.
        mod(MavenPublication) {
            groupId = project.group
            artifactId = 'cozyvoicechat'
            version = publishVersion
            artifact tasks.jarJar   // reobf runs before publishing, see below
            artifact tasks.modSourcesJar
            configurePom(pom, 'Cozy Voice Chat', 'Lightweight proximity voice chat for Forge 1.20.1.')
        }
    }
    repositories {
        mavenLocal()
    }
}

// Публикуем уже reobf-нутый jar (SRG-имена), как ждёт fg.deobf у потребителя.
tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn 'reobfJarJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
